<!DOCTYPE html>
<html lang="en"
      data-default-theme="minimal"
      data-theme-lock="minimal"
      data-default-mode="light"
      data-default-brand="#0ea5e9">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transparent PNG Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/crusher-ui.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/themes/minimal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/static/tool-shell.css">
    <script defer src="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/static/tool-shell.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }

        .tool-stack { max-width: 42rem; margin-inline: auto; }
        .tool-card { padding: var(--crusher-spacing-8); display: grid; gap: var(--crusher-spacing-8); }
        .tool-section { display: grid; gap: var(--crusher-spacing-4); }
        .tool-section h2 {
            margin: 0;
            font-size: var(--crusher-font-size-lg); font-weight: 600;
            color: var(--crusher-text-primary);
        }
        .tool-dims { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); gap: var(--crusher-spacing-4); }
        .tool-field { display: grid; gap: var(--crusher-spacing-1); }
        .tool-label { font-size: var(--crusher-font-size-sm); font-weight: 500; color: var(--crusher-text-secondary); }
        input.crusher-tool-control { padding: var(--crusher-spacing-2) var(--crusher-spacing-4); }

        .tool-presets { display: flex; flex-wrap: wrap; gap: var(--crusher-spacing-3); }
        .preset-btn { flex: 1 1 auto; padding: var(--crusher-spacing-2) var(--crusher-spacing-4); font-weight: 500; }

        .tool-preview-shell {
            inline-size: 100%; block-size: 16rem;
            padding: var(--crusher-spacing-4);
            border-radius: var(--crusher-radius-lg);
            background-image:
                linear-gradient(45deg, var(--crusher-background-muted) 25%, transparent 25%),
                linear-gradient(135deg, var(--crusher-background-muted) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, var(--crusher-background-muted) 75%),
                linear-gradient(135deg, transparent 75%, var(--crusher-background-muted) 75%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 0, 10px -10px, 0 10px;
            background-color: var(--crusher-background-surface);
            display: flex; align-items: center; justify-content: center;
        }
        #preview-box {
            background: transparent;
            border: 2px dashed var(--crusher-color-brand-primary);
            border-radius: var(--crusher-radius-md);
            position: relative;
            box-shadow: var(--crusher-shadow-lg);
            inline-size: 100%; block-size: 100%;
        }
        #preview-dimensions {
            position: absolute;
            inset-block-start: -1.75rem; inset-inline-end: 0;
            font-size: var(--crusher-font-size-sm); font-family: monospace;
            color: var(--crusher-color-base-white);
            background: var(--crusher-color-brand-primary);
            padding: 0.1rem var(--crusher-spacing-2);
            border-radius: var(--crusher-radius-md);
        }

        .tool-download-btn {
            inline-size: 100%;
            padding: var(--crusher-spacing-4);
            font-size: var(--crusher-font-size-lg); font-weight: 700;
            display: inline-flex; align-items: center; justify-content: center; gap: var(--crusher-spacing-2);
        }
        .tool-download-btn[disabled] { opacity: 0.5; cursor: not-allowed; }
        .tool-error {
            margin: 0;
            min-block-size: 1.25rem;
            text-align: center;
            font-size: var(--crusher-font-size-sm);
            color: var(--crusher-color-feedback-error, #dc2626);
        }
    </style>
</head>
<body class="crusher-tool-page">

    <main class="crusher-tool-shell">
        <header class="crusher-tool-header">
            <h1 class="crusher-tool-title">Transparent PNG Generator</h1>
            <p class="crusher-tool-lede">Create a blank, transparent PNG of any dimension instantly.</p>
        </header>

        <div class="tool-stack">
            <section class="crusher-tool-surface tool-card">
                <div class="tool-section">
                    <h2>Custom Dimensions</h2>
                    <div class="tool-dims">
                        <div class="tool-field">
                            <label for="width" class="tool-label">Width</label>
                            <input type="number" id="width" value="1920" min="1" class="crusher-tool-control" placeholder="e.g., 1920">
                        </div>
                        <div class="tool-field">
                            <label for="height" class="tool-label">Height</label>
                            <input type="number" id="height" value="1080" min="1" class="crusher-tool-control" placeholder="e.g., 1080">
                        </div>
                    </div>
                </div>

                <div class="tool-section">
                    <h2>Or Use a Preset</h2>
                    <div id="presets-container" class="tool-presets">
                        <button type="button" data-w="1920" data-h="1080" class="crusher-tool-action preset-btn">16:9 (HD)</button>
                        <button type="button" data-w="1024" data-h="768" class="crusher-tool-action preset-btn">4:3 (Standard)</button>
                        <button type="button" data-w="1080" data-h="1080" class="crusher-tool-action preset-btn">1:1 (Square)</button>
                        <button type="button" data-w="1080" data-h="1920" class="crusher-tool-action preset-btn">9:16 (Story)</button>
                    </div>
                </div>

                <div class="tool-section">
                    <h2>Preview</h2>
                    <div class="tool-preview-shell">
                        <div id="preview-box">
                            <span id="preview-dimensions">1920 x 1080</span>
                        </div>
                    </div>
                </div>

                <div>
                    <button id="download-btn" type="button" class="crusher-tool-action tool-download-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        Download PNG
                    </button>
                    <p id="error-message" class="tool-error"></p>
                </div>
            </section>
        </div>
    </main>

    <a href="https://tools.muhammadhassaanjaved.com/" id="hub-bubble" class="crusher-tool-fab" title="View All Tools" target="_blank" rel="noopener noreferrer">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
    </a>

    <crusher-style-switcher
      default-theme="minimal"
      default-brand="#0ea5e9"
      hide-themes
      hide-theme-color></crusher-style-switcher>
    <script type="module" src="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/crusher-ui.standalone.esm.js"></script>

    <script>
        const widthInput = document.getElementById('width');
        const heightInput = document.getElementById('height');
        const presetsContainer = document.getElementById('presets-container');
        const previewBox = document.getElementById('preview-box');
        const previewDimensions = document.getElementById('preview-dimensions');
        const downloadBtn = document.getElementById('download-btn');
        const errorMessage = document.getElementById('error-message');

        const MAX_DIMENSION = 16384;

        function updatePreview() {
            const width = parseInt(widthInput.value, 10);
            const height = parseInt(heightInput.value, 10);

            const isValid = validateInputs(width, height);
            downloadBtn.disabled = !isValid;

            if (!isValid) {
                previewBox.style.aspectRatio = 'auto';
                return;
            }

            previewDimensions.textContent = `${width} x ${height}`;
            previewBox.style.aspectRatio = `${width} / ${height}`;
        }

        function validateInputs(width, height){
            if (isNaN(width) || isNaN(height) || width < 1 || height < 1) {
                errorMessage.textContent = 'Dimensions must be at least 1x1.';
                return false;
            }
            if (width > MAX_DIMENSION || height > MAX_DIMENSION) {
                errorMessage.textContent = `Dimensions cannot exceed ${MAX_DIMENSION}px.`;
                return false;
            }
            errorMessage.textContent = '';
            return true;
        }

        function setDimensions(w, h) {
            widthInput.value = w;
            heightInput.value = h;
            updatePreview();
        }

        function downloadImage() {
            const width = parseInt(widthInput.value, 10);
            const height = parseInt(heightInput.value, 10);

            if (!validateInputs(width, height)) return;

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;

            const link = document.createElement('a');
            link.download = `transparent_${width}x${height}.png`;
            link.href = canvas.toDataURL('image/png');

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        widthInput.addEventListener('input', updatePreview);
        heightInput.addEventListener('input', updatePreview);

        presetsContainer.addEventListener('click', (e) => {
            const btn = e.target.closest('.preset-btn');
            if (btn) {
                setDimensions(btn.dataset.w, btn.dataset.h);
            }
        });

        downloadBtn.addEventListener('click', downloadImage);
        updatePreview();
    </script>
</body>
</html>

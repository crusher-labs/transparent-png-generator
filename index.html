    <script type="module" src="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/crusher-ui.standalone.esm.js" integrity="sha384-RkuNGzCebUwZ5RZDFSKGQ7sDaUpdPfDxO088yXDMPM5CvJ4eBy2Jf/UhLwGay/4K" crossorigin="anonymous"></script>

    <script>
        const widthInput = document.getElementById('width');
        const heightInput = document.getElementById('height');
        const presetsContainer = document.getElementById('presets-container');
        const previewBox = document.getElementById('preview-box');
        const previewDimensions = document.getElementById('preview-dimensions');
        const downloadBtn = document.getElementById('download-btn');
        const errorMessage = document.getElementById('error-message');

        const MAX_DIMENSION = 16384;

        function updatePreview() {
            const width = parseInt(widthInput.value, 10);
            const height = parseInt(heightInput.value, 10);

            const isValid = validateInputs(width, height);
            downloadBtn.disabled = !isValid;

            if (!isValid) {
                previewBox.style.aspectRatio = 'auto';
                return;
            }

            previewDimensions.textContent = `${width} x ${height}`;
            previewBox.style.aspectRatio = `${width} / ${height}`;
        }

        function validateInputs(width, height){
            if (isNaN(width) || isNaN(height) || width < 1 || height < 1) {
                errorMessage.textContent = 'Dimensions must be at least 1x1.';
                return false;
            }
            if (width > MAX_DIMENSION || height > MAX_DIMENSION) {
                errorMessage.textContent = `Dimensions cannot exceed ${MAX_DIMENSION}px.`;
                return false;
            }
            errorMessage.textContent = '';
            return true;
        }

        function setDimensions(w, h) {
            widthInput.value = w;
            heightInput.value = h;
            updatePreview();
        }

        function downloadImage() {
            const width = parseInt(widthInput.value, 10);
            const height = parseInt(heightInput.value, 10);

            if (!validateInputs(width, height)) return;

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;

            const link = document.createElement('a');
            link.download = `transparent_${width}x${height}.png`;
            link.href = canvas.toDataURL('image/png');

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        widthInput.addEventListener('input', updatePreview);
        heightInput.addEventListener('input', updatePreview);

        presetsContainer.addEventListener('click', (e) => {
            const btn = e.target.closest('.preset-btn');
            if (btn) {
                setDimensions(btn.dataset.w, btn.dataset.h);
            }
        });

        downloadBtn.addEventListener('click', downloadImage);
        updatePreview();
    </script>

    <section class="tool-feedback" aria-label="Tool feedback">
        <details class="tool-feedback-details">
            <summary class="tool-feedback-trigger">Suggest an improvement</summary>
            <form id="tool-feedback-form" class="tool-feedback-form" novalidate>
                <label class="tool-feedback-field">
                    <span>What could be better?</span>
                    <textarea name="improvement" rows="3" required maxlength="2000" class="crusher-tool-control" placeholder="Tell me what's missing or what could work better…"></textarea>
                </label>
                <label class="tool-feedback-field">
                    <span>Your email (optional, only if you want a reply)</span>
                    <input type="email" name="replyto" maxlength="200" class="crusher-tool-control" placeholder="your@email.com">
                </label>
                <input type="text" name="botcheck" class="tool-feedback-honey" tabindex="-1" autocomplete="off" aria-hidden="true">
                <div>
                    <button type="submit" class="crusher-tool-action tool-feedback-submit">Send</button>
                </div>
                <p id="tool-feedback-status" class="tool-feedback-status" role="status" aria-live="polite"></p>
            </form>
        </details>
    </section>

    <script>
        (function() {
            const KEY = '30e570c5-aeeb-439d-8a8a-bd2516a5dc5d';
            const ENDPOINT = 'https://api.web3forms.com/submit';
            const form = document.getElementById('tool-feedback-form');
            const status = document.getElementById('tool-feedback-status');
            if (!form || !status) return;
            const toolName = (document.title || 'tool').trim();
            const subject = '[' + toolName + '] Improvement suggestion';
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const fd = new FormData(form);
                fd.set('access_key', KEY);
                fd.set('subject', subject);
                fd.set('from_name', toolName);
                const btn = form.querySelector('button[type="submit"]');
                const orig = btn.textContent;
                btn.disabled = true; btn.textContent = 'Sending…';
                status.textContent = ''; delete status.dataset.kind;
                try {
                    const res = await fetch(ENDPOINT, { method: 'POST', body: fd, headers: { 'Accept': 'application/json' } });
                    const data = await res.json();
                    if (data.success) {
                        form.reset();
                        status.textContent = 'Thanks — your suggestion is in.';
                        status.dataset.kind = 'ok';
                    } else {
                        status.textContent = data.message || 'Sorry, that did not go through. Try again later?';
                        status.dataset.kind = 'error';
                    }
                } catch (err) {
                    status.textContent = 'Network error. Try again?';
                    status.dataset.kind = 'error';
                } finally {
                    btn.disabled = false; btn.textContent = orig;
                }
            });
        })();
    </script>
